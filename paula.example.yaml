# Copy this file to paula.yaml and edit it. The README documents every key,
# with its default.

persona: personas/paula.yaml

runners:
  openrouter:
    type: openrouter
    # The provider block holds the settings that only this API documents. They
    # apply to every model of the runner, and a model can override them.
    provider:
      routing:
        zdr: true

  venice:
    type: venice

  # A search API for the web tools, with the key in TAVILY_API_KEY. It serves
  # no models. Venice searches too, so leave it out to search through Venice.
  # tavily:
  #   type: tavily

# Every model caches its prompt the way the host of its family caches best.
# cache: false on a model turns that off, where its host allows it.
models:
  pro:
    runner: openrouter
    id: deepseek/deepseek-v4-pro-0813
    context: 262144
    sampling:
      temperature: 0.8
    reasoning:
      effort: high

  flash:
    runner: venice
    id: deepseek-v4-1-flash

  # The photos she takes are made from her avatar by one model, and the avatar
  # is painted from the card by another, once, when data_dir holds none.
  photos:
    runner: venice
    id: seedream-v5-lite-edit

  face:
    runner: venice
    id: seedream-v5-lite

default_models:
  chat: pro
  vision: flash
  image: photos
  avatar: face

frontends:
  repl:

  # A bot to text her from, with the token in TELEGRAM_TOKEN and the number
  # Telegram knows you by. Leave it out to reach her from the terminal alone.
  # telegram:
  #   user_id: 123456789

  # A browser to reach her from, with the token in PAULA_WEB_TOKEN. Anyone who
  # reaches the address and has the token reads the conversation.
  # web:
  #   listen: 127.0.0.1:8484

# What she can do in the middle of a reply: list, search, keep and forget
# memories; list the pictures of the conversation and look at one again;
# schedule a time to write to you on her own; search the web and read a page,
# through the runner web names; and take photos of herself and send them. None
# of it is ever in her prompt, so these are how she reaches them.
tools:
  memory:
  images:
  callbacks:
  web:
    runner: venice
  photos:
