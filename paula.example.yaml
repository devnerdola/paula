# Copy this file to paula.yaml and edit it. The README documents every key,
# with its default.

persona: personas/paula.yaml

runners:
  openrouter:
    type: openrouter
    # The provider block holds the settings that only this API documents. They
    # apply to every model of the runner, and a model can override them.
    provider:
      routing:
        zdr: true

  venice:
    type: venice

models:
  pro:
    runner: openrouter
    id: deepseek/deepseek-v4-pro-0813
    context: 262144
    sampling:
      temperature: 0.8
    reasoning:
      effort: high

  flash:
    runner: venice
    id: deepseek-v4-1-flash

  vectors:
    runner: venice
    id: text-embedding-bge-m3

default_models:
  chat: pro
  vision: flash
  embed: vectors

frontends:
  repl:

  # A bot to text her from, with the token in TELEGRAM_TOKEN and the number
  # Telegram knows you by. Leave it out to reach her from the terminal alone.
  # telegram:
  #   user_id: 123456789

  # A browser to reach her from, with the token in PAULA_WEB_TOKEN. Anyone who
  # reaches the address and has the token reads the conversation.
  # web:
  #   listen: 127.0.0.1:8484
